<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Link Target</title>
    <style>
      body { margin: 0; padding: 0 0 30px 0; background-color: #f4f6fb; color: #1d2433; font-family: roboto, sans-serif; }
      .top { background-color: #14213d; color: #ffffff; padding: 14px 24px; }
      .top-title { font-size: 20px; font-weight: bold; margin: 0; }
      .page { max-width: 860px; margin: 0 auto; padding: 16px 24px; }
      .section { background-color: #ffffff; border: 1px solid #dde3ee; border-radius: 10px; padding: 12px 16px; margin: 14px 0; }
      a { color: #14213d; font-weight: bold; }
      a:visited { color: #8e44ad; }
      .note { color: #56617a; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="top">
      <p class="top-title">Link Target Page</p>
    </div>
    <div class="page">
      <div class="section">
        <p>You navigated here from the Milestone 6 page. This URL is now in the tab's history.</p>
        <p><a href="https://example.dev/m6">&laquo; Back to Milestone 6</a> &mdash; when you return, the link
        that pointed here will render <code>:visited</code> purple.</p>
        <p class="note">A tiny real page so the visited-link demo has somewhere to go and come back from.</p>
      </div>
    </div>
  </body>
</html>
