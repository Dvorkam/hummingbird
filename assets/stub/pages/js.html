<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hummingbird JS Quick Check</title>
    <style>
      body { margin: 0; padding: 0 0 30px 0; background-color: #f4f6fb; color: #1d2433; font-family: roboto, sans-serif; }
      .top { background-color: #14213d; color: #ffffff; padding: 14px 24px; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
      .top-title { font-size: 20px; font-weight: bold; margin: 0; }
      .top a { color: #fca311; }
      .page { max-width: 860px; margin: 0 auto; padding: 16px 24px; }
      .section { background-color: #ffffff; border: 1px solid #dde3ee; border-radius: 10px; padding: 12px 16px; margin: 14px 0; }
      code { background-color: #e8ecf4; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body onload="const target = document.getElementById('js-demo'); if (target) { target.textContent = 'Load event fired.'; }">
    <div class="top">
      <p class="top-title">JS Quick Check</p>
      <a href="https://example.dev">&larr; back to example.dev</a>
    </div>
    <div class="page">
      <div class="section">
        <p id="js-demo">Waiting for script...</p>
        <button onclick="const target = document.getElementById('js-demo'); if (target) { target.textContent = 'Clicked!'; }">Click to run JS</button>
        <script>
          const target = document.getElementById("js-demo");
          if (target) {
            target.textContent = "JS updated this text.";
            target.setAttribute("data-js", "ok");
          }
        </script>
        <p>Expected sequence: inline script sets the text, then <code>onload</code> overwrites it,
        then clicking the button sets it to <code>Clicked!</code>. The full demo lives at
        <a href="https://example.dev/m4">example.dev/m4</a>.</p>
      </div>
    </div>
  </body>
</html>
