name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "doc/**"
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "doc/**"
      - "**.md"
      - "LICENSE"
      - "NOTICE"

jobs:
  # JOB 1: Code Formatting Check
  # Fails if code doesn't match .clang-format rules
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run clang-format style check
        uses: jidicula/clang-format-action@v4.11.0
        with:
          clang-format-version: "15"
          check-path: "src"           # Only check your source folder
          fallback-style: "Google"    # Fallback if .clang-format is missing

  # JOB 2: Bundled public suffix list is really generated from its source
  # A hand edit to src/core/net/PublicSuffixData.h would be silently reverted by
  # the next automated refresh, so catch it here instead. Does NOT check whether
  # the bundle is behind upstream -- that would fail every PR whenever upstream
  # moves, which is the daily refresh job's business and the release gate's.
  public_suffix_list:
    name: Check Public Suffix Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated data matches its pinned upstream commit
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_public_suffix_list.ps1 -Check

  # JOB 3: Build & Test
  build:
    name: ${{ matrix.os }} Build
    needs: formatting
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write   # needed so actions/cache can save caches on pushes / same-repo PRs

    strategy:
      fail-fast: false
      matrix:
        # Windows runners ship VS2026; the vcpkg baseline must stay recent
        # enough to detect that toolset.
        os: [ubuntu-latest, windows-latest]

    # vcpkg binary caching using a local folder + actions/cache
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg/bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Cache vcpkg downloads + built package binaries
      # This is the key fix: it avoids rebuilding all ports on every run.
      - name: Cache vcpkg (downloads + binary cache)
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Linux build deps (xvfb for headless tests, + common autotools deps that some ports pull in)
      - name: Setup GCC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build \
            libx11-dev libxft-dev libxext-dev \
            xvfb \
            autoconf autoconf-archive automake libtool libltdl-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Optional: ccache for faster rebuilds of *your* code (not vcpkg ports)
      - name: Setup ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # Setup vcpkg (manifests)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      # Configure (Linux: enable ccache launcher)
      - name: CMake Configure (Linux)
        if: runner.os == 'Linux'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: "ninja-multi-vcpkg"
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache']"

      # Configure (Windows)
      - name: CMake Configure (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: "ninja-multi-vcpkg"
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=Release']"

      # Build
      - name: Build
        run: cmake --build --preset ninja-multi-vcpkg --config Release

      # Run Tests (Linux with xvfb for headless window support)
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run ctest --preset ninja-multi-vcpkg --output-on-failure -C Release
        env:
          HB_RUN_SMOKE_TEST: "1"

      # Run Tests (Windows)
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --preset ninja-multi-vcpkg --output-on-failure -C Release
        env:
          HB_RUN_SMOKE_TEST: "1"
          HB_HEADLESS: "1"
          SDL_RENDER_DRIVER: "software"

  # JOB 3: Parser Fuzzing (short, coverage-guided) — story 7.5.3.
  # Builds the libFuzzer targets with clang (ASan + coverage) and runs each for a
  # bounded time seeded from tests/fuzz/corpus. A crash fails the job and its
  # reproducer is uploaded so it can be checked into the corpus (fix-forward).
  fuzz:
    name: Parser Fuzzing (short)
    needs: formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg/bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache vcpkg (downloads + binary cache)
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg/bincache
          key: vcpkg-fuzz-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-fuzz-

      - name: Install clang + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang ninja-build \
            libx11-dev libxft-dev libxext-dev \
            autoconf autoconf-archive automake libtool libltdl-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: CMake Configure (fuzzing, clang)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: "ninja-multi-vcpkg"
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=Release', '-DHB_ENABLE_FUZZING=ON', '-DCMAKE_C_COMPILER=clang', '-DCMAKE_CXX_COMPILER=clang++']"

      - name: Build fuzz targets
        run: cmake --build --preset ninja-multi-vcpkg --config Release --target html_parser_fuzzer css_parser_fuzzer

      - name: Fuzz the HTML parser
        run: ./build/tests/Release/html_parser_fuzzer -max_total_time=45 -print_final_stats=1 tests/fuzz/corpus/html

      - name: Fuzz the CSS parser
        run: ./build/tests/Release/css_parser_fuzzer -max_total_time=45 -print_final_stats=1 tests/fuzz/corpus/css

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
