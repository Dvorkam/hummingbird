name: Public Suffix List

# The public suffix list decides where one party's domain ends and a registry
# begins. Cookie scoping, same-site and (from M9) CORS credentials all depend on
# it, and it changes as registries and hosting providers appear. It is bundled at
# build time rather than fetched at runtime, so keeping it current is CI's job,
# not a human's memory.
#
# This workflow opens a PULL REQUEST rather than committing or failing:
#   - a red scheduled build on master is noise nobody acts on;
#   - upstream is a community-maintained file that anyone can submit entries to,
#     so auto-merging it straight into a security boundary is a supply-chain
#     path. A PR puts a reviewable diff in front of a person and runs the full
#     test suite -- including the list's own conformance vectors -- before it
#     lands.

on:
  schedule:
    # Daily. The list changes often enough to matter and rarely enough that this
    # is usually a no-op.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Check upstream and open a PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rewrites both the rule data and the vendored conformance vectors, from
      # the same upstream commit.
      - name: Regenerate against upstream HEAD
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_public_suffix_list.ps1 -Latest

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Public suffix list is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # Deliberately plain git + the bundled `gh`, not a third-party action.
      # This job exists because a community-maintained file feeds a security
      # boundary; handing a third-party action write access to the repo to
      # deliver it would undo the point.
      - name: Open or update the refresh pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=chore/public-suffix-list
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/core/net/PublicSuffixData.h tests/fixtures/public_suffix_tests.txt
          git commit -m "chore: refresh the bundled public suffix list" \
                     -m "Regenerated by .github/workflows/public-suffix-list.yml against upstream HEAD. The rule data and the conformance vectors come from the same upstream commit."
          # One reusable branch: a second refresh before the first is merged
          # updates that PR rather than opening a competing one.
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base master \
              --title "chore: refresh the bundled public suffix list" \
              --body "$(cat <<'BODY'
          Automated refresh of the bundled [public suffix list](https://publicsuffix.org).

          **Review this like a security change, because it is one.** These rules decide
          which hosts count as one site for cookie scoping, SameSite and CORS
          credentials, and entries are community-submitted upstream.

          Worth a look in the diff:

          - **Removals widen a boundary.** Hosts that were separate sites become one
            site, so cookies start being shared where they previously were not.
          - **New PRIVATE entries narrow one.** Subdomains of a hosting provider stop
            sharing cookies with their parent. Correct, but it logs people out of
            anything hosted there.

          CI runs the list's own conformance vectors against the regenerated data, so a
          structurally broken refresh fails before it can be merged.
          BODY
          )"
          else
            echo "Existing PR updated by the force-push."
          fi
