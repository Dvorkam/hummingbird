# Hummingbird clang-uml config (works with clang-uml 0.6.x)
#
# Scope note (T-ARCH-GUARD-2): the diagrams intentionally cover only the
# *portable* layers (app, core, engine, html, layout, renderer, style) and the
# platform *port* (src/core/platform_api). The platform *adapters*
# (src/platform/* — SDL/Blend2D/curl/lunasvg glue) are NOT parsed: they drag in
# third-party headers that libclang cannot always parse on this toolchain
# (e.g. SDL's MSVC intrinsics), and UML-ing third-party glue adds noise without
# signal. The architectural invariant that matters — nothing depends *inward* on
# the adapters — is enforced by the DependencyFirewall test (T-ARCH-GUARD-1),
# not by these diagrams.
#
# Every diagram's `glob` selects our source minus the platform adapters via the
# regex ".*src.(app|core|engine|html|layout|renderer|style).*\.cpp$" (the `.`
# after `src` matches either path separator, / or \).

compilation_database_dir: build
output_directory: doc/diagrams

# Method arguments off everywhere: signatures are noise at the architecture level.
generate_method_arguments: none

diagrams:
  hummingbird_packages:
    type: package
    title: Hummingbird - packages (portable layers + platform port)
    package_type: directory
    glob:
      - r: ".*src.(app|core|engine|html|layout|renderer|style).*\\.cpp$"
    include:
      paths:
        - src/app
        - src/core
        - src/engine
        - src/html
        - src/layout
        - src/renderer
        - src/style
    exclude:
      paths:
        - tests
        - build
        - vcpkg_installed

  platform_api:
    type: class
    title: Platform API (port interfaces & factories)
    generate_packages: true
    package_type: directory
    glob:
      # Engine + renderer + app consume the port; parsing them surfaces the
      # interfaces/factories without the slower html/layout/style TUs.
      - r: ".*src.(app|core|engine|renderer).*\\.cpp$"
    include:
      # Only the port itself; consumers/adapters are elsewhere and out of frame.
      paths:
        - src/core/platform_api
      namespaces:
        - Hummingbird
    exclude:
      access:
        - private
      # Kill the anonymous union/struct payloads (e.g. InputEvent's per-variant
      # members), which libclang emits once per translation unit — pure noise.
      elements:
        - r: ".*anonymous.*"

  engine_document_pipeline:
    type: class
    title: Engine - document pipeline
    generate_packages: true
    package_type: directory
    include_relations_also_as_members: false
    glob:
      # Only engine TUs are needed to model the engine pipeline classes.
      - r: ".*src.engine.*\\.cpp$"
    include:
      paths:
        - src/engine/document
        - src/engine/resources
        - src/engine/script
        - src/engine/tab
      # Only the engine's own classes (drops DOM/Layout/Css/platform context and
      # all std/template/anonymous noise) so the pipeline view stays focused.
      namespaces:
        - Hummingbird::Engine
    exclude:
      access:
        - private
      elements:
        - r: ".*anonymous.*"
